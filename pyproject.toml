[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["cleaning", "extract", "transform", "validation", "features", "model", "queries", "gerar_dados_sinteticos"]
