name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src scripts tests dashboard

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Testes (limpeza, gerador, pipeline, SQL, modelo e painel)
        run: pytest --cov=src --cov=scripts --cov-report=term-missing
      - name: Pipeline de ponta a ponta com a base fictícia
        run: |
          python scripts/gerar_dados_sinteticos.py
          python src/extract.py
          python src/transform.py
          grep -q "Todas as tabelas passaram" data/final/_relatorio_tratamento.md
          python src/queries.py
          python src/model.py
      - name: Relatório de tratamento no resumo do job
        if: matrix.python == '3.12'
        run: cat data/final/_relatorio_tratamento.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aprovaedu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (saúde, usuário sem privilégios e pipeline dentro da imagem)
        run: |
          docker run -d --name app -p 8501:8501 aprovaedu:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8501/_stcore/health
          test "$(docker exec app id -u)" = "1000"
          docker exec app sh -c "python scripts/gerar_dados_sinteticos.py --alunos 100 \
            && python src/extract.py && python src/transform.py"
          docker exec app grep -q "Todas as tabelas passaram" data/final/_relatorio_tratamento.md
          docker logs app
      - name: Login no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publica no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bigleno/data-analytics-portfolio:latest
            ghcr.io/bigleno/data-analytics-portfolio:${{ github.sha }}
          cache-from: type=gha
